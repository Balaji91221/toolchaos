<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">ToolChaos workflow overview</title>
<desc id="desc">The tool ran. The reply never arrived. Simulate a lost reply: Introduce a controlled tool failure.. Let the agent respond: Retry, deduplicate, or reconcile.. Check the actual effects: Compare recovery with fixture state.</desc>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="428" rx="20" fill="url(#wash)" stroke="#dbe3ee"/>
<path d="M40 36h36" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
<text x="92" y="42" fill="#4f46e5" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2">AGENT RELIABILITY</text>
<text x="1160" y="42" fill="#64748b" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1">TOOLCHAOS</text>
<text x="38" y="112" fill="#101b30" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" letter-spacing="-1">The tool ran.</text>
<text x="38" y="164" fill="#101b30" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" letter-spacing="-1">The reply never arrived.</text>
<rect x="38" y="214" width="356" height="140" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
<rect x="58" y="232" width="28" height="28" rx="8" fill="#4f46e5"/>
<text x="72" y="251" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">1</text>
<text x="98" y="251" fill="#4f46e5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">INJECT</text>
<text x="58" y="293" fill="#15243b" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Simulate a lost reply</text>
<text x="58" y="325" fill="#52627a" font-family="Arial,Helvetica,sans-serif" font-size="15">Introduce a controlled tool failure.</text>
<path d="M400 281h14m-5-5 5 5-5 5" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="421" y="214" width="356" height="140" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
<rect x="441" y="232" width="28" height="28" rx="8" fill="#4f46e5"/>
<text x="455" y="251" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">2</text>
<text x="481" y="251" fill="#4f46e5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">RECOVER</text>
<text x="441" y="293" fill="#15243b" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Let the agent respond</text>
<text x="441" y="325" fill="#52627a" font-family="Arial,Helvetica,sans-serif" font-size="15">Retry, deduplicate, or reconcile.</text>
<path d="M783 281h14m-5-5 5 5-5 5" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="804" y="214" width="356" height="140" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
<rect x="824" y="232" width="28" height="28" rx="8" fill="#4f46e5"/>
<text x="838" y="251" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">3</text>
<text x="864" y="251" fill="#4f46e5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">INSPECT</text>
<text x="824" y="293" fill="#15243b" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Check the actual effects</text>
<text x="824" y="325" fill="#52627a" font-family="Arial,Helvetica,sans-serif" font-size="15">Compare recovery with fixture state.</text>
<text x="38" y="396" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.2">ILLUSTRATED WORKFLOW</text>
<text x="1160" y="396" text-anchor="end" fill="#52627a" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1">SDK / MCP PROXY / CLI</text></svg>
